name: Release (macOS)

# Builds GUIDude.app with PyInstaller on an Apple Silicon runner.
#  - push of a tag v<APP_VERSION>  -> draft GitHub release with the zipped app
#  - manual run (workflow_dispatch) -> build only, app available as workflow artifact
#
# libavrdude (SWIG module + avrdude.conf) is built from avrdude sources:
# by default the official avrdude release below, overridable for manual runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      avrdude_repo:
        description: "avrdude repository (owner/name)"
        default: "avrdudes/avrdude"
      avrdude_ref:
        description: "avrdude tag, branch or commit"
        default: "v8.3"

permissions:
  contents: write          # needed to create the release

env:
  AVRDUDE_REPO: ${{ inputs.avrdude_repo || 'avrdudes/avrdude' }}
  AVRDUDE_REF: ${{ inputs.avrdude_ref || 'v8.3' }}
  # SWIG module, PyInstaller and the app must all use this Python
  PYTHON: python3.14
  PYINSTALLER_VERSION: "6.22.3"
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  macos:
    # Homebrew bottles are built for the runner's macOS version, so the app
    # requires at least this macOS version (15 = Sequoia).
    runs-on: macos-15
    steps:
      - name: Check out GUIDude
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' guidude.py)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $v in guidude.py"
            exit 1
          fi

      - name: Check out avrdude (${{ env.AVRDUDE_REPO }} @ ${{ env.AVRDUDE_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AVRDUDE_REPO }}
          ref: ${{ env.AVRDUDE_REF }}
          path: avrdude-src

      - name: Install build dependencies
        run: brew install swig libusb libusb-compat hidapi libftdi python@3.14 python-tk@3.14

      - name: Build libavrdude Python module
        run: ./build_lib.sh avrdude-src

      - name: Build app bundle (includes --selftest)
        run: ./make_dist.sh

      - name: Package
        run: |
          name="GUIDude-$VERSION-macOS-$(uname -m)"
          # ditto keeps the bundle's symlinks and code signature intact
          ditto -c -k --sequesterRsrc --keepParent dist/GUIDude.app "$name.zip"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUIDude-${{ steps.version.outputs.version }}-macOS
          path: GUIDude-*.zip*

      - name: Create or update draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "GUIDude $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" GUIDude-*.zip GUIDude-*.zip.sha256 --clobber
