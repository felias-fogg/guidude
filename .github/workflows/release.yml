name: Release

# Builds self-contained GUIDude packages with PyInstaller:
#   macOS arm64   (Apple Silicon, macOS 11 Big Sur or later)
#   macOS x86_64  (Intel, macOS 10.13 High Sierra or later)
#   Linux x86_64  and  Linux aarch64  (glibc 2.35 or later: Ubuntu 22.04,
#                  Debian 12, Raspberry Pi OS bookworm, Fedora 36, ...)
#   Windows x64   (Windows 10 or later)
#
#  - push of a tag v<APP_VERSION>  -> draft GitHub release with all packages
#  - manual run (workflow_dispatch) -> build only, packages as workflow artifacts
#
# To run on old systems, the packages are built against old libraries:
# on macOS the USB libraries are compiled with a low deployment target and
# Python comes from python.org; on Linux everything is built in an Ubuntu 22.04
# container (an executable only runs with the glibc it was built with or newer;
# 22.04 is the oldest still supported mainstream distro - Debian 11 is EOL).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      avrdude_repo:
        description: "avrdude repository (owner/name)"
        default: "avrdudes/avrdude"
      avrdude_ref:
        description: "avrdude tag, branch or commit"
        default: "v8.3"

permissions:
  contents: write          # needed to create the release

env:
  AVRDUDE_REPO: ${{ inputs.avrdude_repo || 'avrdudes/avrdude' }}
  AVRDUDE_REF: ${{ inputs.avrdude_ref || 'v8.3' }}
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       arch: arm64,  min_macos: "11.0" }
          - { runner: macos-15-intel, arch: x86_64, min_macos: "10.13" }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}
      DEPS_PREFIX: ${{ github.workspace }}/deps
      # python.org installer: universal2, runs on macOS 10.13+, includes Tk
      PYTHON_PKG_URL: https://www.python.org/ftp/python/3.13.17/python-3.13.17-macos11.pkg
      PYTHON: /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Check out GUIDude
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' guidude.py)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $v in guidude.py"
            exit 1
          fi

      - name: Check out avrdude (${{ env.AVRDUDE_REPO }} @ ${{ env.AVRDUDE_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AVRDUDE_REPO }}
          ref: ${{ env.AVRDUDE_REF }}
          path: avrdude-src

      - name: Install build tools
        # only tools; no libraries from Homebrew end up in the app
        run: brew install swig pkgconf

      - name: Install Python from python.org
        run: |
          curl -fsSLo python.pkg "$PYTHON_PKG_URL"
          sudo installer -pkg python.pkg -target /
          "$PYTHON" -c "import sys, tkinter; print(sys.version, 'Tk', tkinter.TkVersion)"

      - name: Cache USB libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: macos-deps-${{ matrix.arch }}-${{ matrix.min_macos }}-${{ hashFiles('ci/build-macos-deps.sh') }}

      - name: Build USB libraries for macOS ${{ matrix.min_macos }}
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ci/build-macos-deps.sh "$DEPS_PREFIX"

      - name: Build libavrdude Python module
        run: ./build_lib.sh avrdude-src

      - name: Build app bundle (includes --selftest)
        run: ./make_dist.sh

      - name: Check minimum macOS version of all binaries
        run: ci/check-macos-minos.sh dist/GUIDude.app

      - name: Package
        run: |
          name="GUIDude-$VERSION-macOS-${{ matrix.arch }}"
          # app + install notes in one folder; ditto keeps the bundle's
          # symlinks and code signature intact
          mkdir -p "pkg/GUIDude"
          ditto dist/GUIDude.app pkg/GUIDude/GUIDude.app
          cp mac/INSTALL.txt pkg/GUIDude/
          ditto -c -k --sequesterRsrc --keepParent pkg/GUIDude "$name.zip"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUIDude-${{ steps.version.outputs.version }}-macOS-${{ matrix.arch }}
          path: GUIDude-*.zip*

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    # Ubuntu 22.04: glibc 2.35, Python 3.10, Tk 8.6
    container: ubuntu:22.04
    env:
      PYTHON: python3
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential cmake swig flex bison git ca-certificates file \
            python3-dev python3-venv python3-tk \
            libusb-1.0-0-dev libusb-dev libhidapi-dev libftdi1-dev

      - name: Check out GUIDude
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' guidude.py)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $v in guidude.py"
            exit 1
          fi

      - name: Check out avrdude (${{ env.AVRDUDE_REPO }} @ ${{ env.AVRDUDE_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AVRDUDE_REPO }}
          ref: ${{ env.AVRDUDE_REF }}
          path: avrdude-src

      - name: Build libavrdude Python module
        run: ./build_lib.sh avrdude-src

      - name: Build application (includes --selftest)
        run: ./make_dist.sh

      - name: Package
        run: |
          name="GUIDude-$VERSION-linux-${{ matrix.arch }}"
          # udev rules and install notes: users must copy the rules themselves
          cp linux/99-guidude.rules linux/INSTALL.txt dist/GUIDude/
          tar -czf "$name.tar.gz" -C dist GUIDude
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "Newest glibc symbol required:"
          find dist/GUIDude -type f -exec sh -c 'file -b "$1" | grep -q ELF && objdump -T "$1"' _ {} \; 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUIDude-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
          path: GUIDude-*.tar.gz*

  windows:
    name: Windows x64
    runs-on: windows-2025
    defaults:
      run:
        shell: bash          # Git Bash: the same build scripts as on macOS/Linux
    env:
      PYTHON: python
    steps:
      - name: Check out GUIDude
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' guidude.py)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $v in guidude.py"
            exit 1
          fi

      - name: Check out avrdude (${{ env.AVRDUDE_REPO }} @ ${{ env.AVRDUDE_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AVRDUDE_REPO }}
          ref: ${{ env.AVRDUDE_REF }}
          path: avrdude-src

      - name: Install Python (python.org build, includes Tk)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        # MSVC and CMake are on the runner; flex/bison as in avrdude's own CI
        run: |
          curl -fsSL -o winflexbison.zip \
            https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip
          7z x -y -owinflexbison winflexbison.zip > /dev/null
          cygpath -w "$PWD/winflexbison" >> "$GITHUB_PATH"
          command -v swig || choco install swig -y --no-progress
          python -c "import sys, tkinter; print(sys.version, 'Tk', tkinter.TkVersion)"

      - name: Build libavrdude Python module
        run: ./build_lib.sh avrdude-src

      - name: Build application (includes --selftest)
        run: ./make_dist.sh

      - name: Package
        run: |
          name="GUIDude-$VERSION-windows-x64"
          cp windows/INSTALL.txt dist/GUIDude/
          (cd dist && 7z a -tzip "../$name.zip" GUIDude > /dev/null)
          sha256sum "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GUIDude-${{ steps.version.outputs.version }}-windows-x64
          path: GUIDude-*.zip*

  release:
    name: Draft release
    needs: [macos, linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Collect packages
        uses: actions/download-artifact@v4
        with:
          pattern: GUIDude-*
          merge-multiple: true
          path: assets

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -l assets
          cat > notes.md << 'EOF'
          | Package | System |
          |---|---|
          | `GUIDude-*-macOS-arm64.zip` | Mac with Apple Silicon, macOS 11 or later |
          | `GUIDude-*-macOS-x86_64.zip` | Mac with Intel processor, macOS 10.13 or later |
          | `GUIDude-*-linux-x86_64.tar.gz` | Linux PC with glibc 2.35+ (Ubuntu 22.04, Debian 12, Fedora 36 or later) |
          | `GUIDude-*-linux-aarch64.tar.gz` | 64-bit ARM Linux, e.g. Raspberry Pi OS 64-bit (bookworm or later) |
          | `GUIDude-*-windows-x64.zip` | Windows 10 or 11, 64-bit (x64) |
          EOF
          if ! gh release view "$GITHUB_REF_NAME" -R "$REPO" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" -R "$REPO" --draft \
              --title "GUIDude $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" -R "$REPO" assets/* --clobber
